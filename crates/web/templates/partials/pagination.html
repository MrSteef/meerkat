<nav class="pagination" aria-label="List pages">
  {% match pagination.previous %}{% when Some with (url) %}<a class="button button-secondary button-sm" href="{{ url }}">← Newer</a>{% when None %}<span></span>{% endmatch %}
  <span class="muted">Page {{ pagination.current }}</span>
  <a class="button button-secondary button-sm" href="{{ pagination.next }}">Older →</a>
</nav>
