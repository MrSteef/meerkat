<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ meta.title }} · Meerkat</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-gmJEF2eAKY4e+FDN+qtKIivWyb6ANwDB7JUdUybKgQspPKyEX/pIRZG/0uaRoW2C" crossorigin="anonymous" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/flows" aria-label="Meerkat home"><span class="brand-mark" aria-hidden="true">●</span><span>meerkat<span class="brand-dot">.</span></span></a>
      <p class="nav-label">Workspace</p>
      <nav class="navigation">
        <a href="/flows" class="nav-link {% if meta.nav == "flows" %}selected{% endif %}">Flows</a>
        <a href="/runs" class="nav-link {% if meta.nav == "runs" %}selected{% endif %}">Runs</a>
        <a href="/messages" class="nav-link {% if meta.nav == "messages" %}selected{% endif %}">Webhook Messages</a>
        <a href="/delivery-attempts" class="nav-link {% if meta.nav == "attempts" %}selected{% endif %}">Delivery Attempts</a>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span> Meerkat V1 <span class="muted-light">· local</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><span class="topbar-label">Monitoring workspace</span><span class="topbar-right">Oracle event detector</span></header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
      <footer class="footer">Meerkat · Scheduled SQL event detection</footer>
    </div>
  </div>
</body>
</html>
